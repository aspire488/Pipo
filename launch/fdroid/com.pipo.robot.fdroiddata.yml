MaintainerNotes: |
  From the release that contains the `pipo.unsignedRelease` opt-out onwards, Pipo's release build
  refuses to run without the upstream keystore, so F-Droid must request an unsigned build explicitly
  (F-Droid signs the APK itself). Use this as the next Builds entry:

        - versionName: "1.1"
          versionCode: 2
          commit: <full hash of the v1.1 tag>
          gradle:
            - yes
          gradleprops:
            - pipo.unsignedRelease=true

  Without `gradleprops`, `assembleRelease` aborts with "Release signing is not configured".
  With it, the build produces build/outputs/apk/release/app-release-unsigned.apk and no debug key is
  involved. Verified locally on 2026-11-10.

