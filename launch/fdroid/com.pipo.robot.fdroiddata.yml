Name: Pipo
Summary: A little robot who lives his own life on your phone
Description: |-
  Pipo is a small robot who lives in a room inside your phone, and he is not waiting for you.

  You don't manage him. He has ten traits rolled once at first launch, twelve moods, memories that
  decay at different rates, and a scoring engine that picks his next activity from about twenty
  options. Open the app and find out what he is doing: welding something at his workbench, chasing a
  moth around the desk lamp, pretending to be asleep, or gone entirely, because the flying machine
  needed a motor and he walked to the hardware shop.

  * Nib, a round amber robot-pet with moods, a bond level and a habit of stealing shiny things
  * Thirteen places to visit, his own weather at the window, odd jobs, cooking and projects
  * Eight games to play with him and a journal written in his own hand
  * Everything is drawn in code: no 3D models, sprite sheets or image assets

  One JSON save file on your device. No account, no analytics, no ads, no in-app purchases. Chat is
  offline: Pipo answers in his own words from a rule-based brain on the device.

