Name: Pipo
Summary: A little robot who lives his own life on your phone
Description: |-
    Pipo is a small robot who lives in a room inside your phone, and he is not waiting for you.

    You don't manage him. He has ten traits rolled once at first launch, twelve moods, memories that
    decay at different rates, and a scoring engine that picks his next activity from about twenty
    options. Open the app and find out what he is doing: welding something at his workbench, chasing a
    moth around the desk lamp, pretending to be asleep, or gone entirely, because the flying machine
    needed a motor and he walked to the hardware shop.

    * Nib, a round amber robot-pet with moods, a bond level and a habit of stealing shiny things
    * Thirteen places to visit, his own weather at the window, odd jobs, cooking and projects
    * Eight games to play with him and a journal written in his own hand
    * Everything is drawn in code: no 3D models, sprite sheets or image assets

    One JSON save file on your device. No account, no analytics, no ads, no in-app purchases. Chat is
    offline: Pipo answers in his own words from a rule-based brain on the device.

RepoType: git
Repo: https://github.com/aspire488/Pipo.git

# v1.0 is the only published release. It predates the `pipo.unsignedRelease` opt-out, so this entry
# does not need it. When v1.1 is published, add the entry shown in MaintainerNotes instead.
# `commit` must be a full hash, not a tag name (F-Droid build metadata reference).
Builds:
  - versionName: "1.0"
    versionCode: 1
    commit: 73afc91002c6d81c452fe6cd38b6b29e39fef626
    gradle:
      - yes
    # v1.0 falls back to the debug signingConfig when no keystore exists; fdroidserver's
    # remove_signing_keys() drops the signingConfigs block but not this line (verified 2026-11-10).
    prebuild: sed -i -e '/signingConfig = signingConfigs.findByName/d' app/build.gradle.kts

MaintainerNotes: |
  From the release that contains the `pipo.unsignedRelease` opt-out onwards, Pipo's release build
  refuses to run without the upstream keystore, so F-Droid must request an unsigned build explicitly
  (F-Droid signs the APK itself). Use this as the next Builds entry:

        - versionName: "1.1"
          versionCode: 2
          commit: <full hash of the v1.1 tag>
          gradle:
            - yes
          gradleprops:
            - pipo.unsignedRelease=true

  Without `gradleprops`, `assembleRelease` aborts with "Release signing is not configured".
  With it, the build produces build/outputs/apk/release/app-release-unsigned.apk and no debug key is
  involved. Verified locally on 2026-11-10: see README.md section 5.

AutoUpdateMode: Version
UpdateCheckMode: Tags
