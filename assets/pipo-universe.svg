<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
 <radialGradient id="bg"><stop stop-color="#34415b"/><stop offset="1" stop-color="#0d111c"/></radialGradient>
 <linearGradient id="shell" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e2"/></linearGradient>
 <linearGradient id="mint" x2="0" y2="1"><stop stop-color="#b7fff1"/><stop offset="1" stop-color="#62d9c7"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect width="1200" height="760" rx="28" fill="url(#grid)"/>
<circle cx="820" cy="380" r="280" fill="#8ff5e2" opacity=".08" filter="url(#glow)"/>
<path d="M0 620Q260 520 480 650T1200 590V760H0Z" fill="#111a2a"/>
<g fill="none" stroke="#8ff5e2" stroke-opacity=".35"><circle cx="825" cy="365" r="245" stroke-dasharray="3 13"/><circle cx="825" cy="365" r="205" stroke-dasharray="1 17"/></g>
<g transform="translate(635 115)">
 <ellipse cx="220" cy="535" rx="180" ry="30" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <!-- antenna -->
 <path d="M220 75V24" stroke="#aeb9c9" stroke-width="13" stroke-linecap="round"/><circle cx="220" cy="18" r="17" fill="#8ff5e2"/><circle cx="220" cy="18" r="31" fill="#8ff5e2" opacity=".2" filter="url(#glow)"/>
 <!-- head -->
 <rect x="90" y="65" width="260" height="205" rx="76" fill="url(#shell)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
 <rect x="111" y="91" width="218" height="150" rx="52" fill="#141b27"/>
 <ellipse cx="170" cy="157" rx="18" ry="29" fill="#8ff5e2"/><ellipse cx="270" cy="157" rx="18" ry="29" fill="#8ff5e2"/>
 <circle cx="164" cy="148" r="6" fill="#fff"/><circle cx="264" cy="148" r="6" fill="#fff"/>
 <path d="M192 201Q220 224 248 201" fill="none" stroke="#8ff5e2" stroke-width="7" stroke-linecap="round"/>
 <!-- body -->
 <rect x="108" y="270" width="224" height="205" rx="67" fill="url(#shell)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
 <path d="M154 325Q220 297 286 325V424Q220 454 154 424Z" fill="#e5ebf2"/>
 <circle cx="220" cy="376" r="30" fill="#8ff5e2" opacity=".18"/><circle cx="220" cy="376" r="17" fill="#8ff5e2"/>
 <!-- arms -->
 <rect x="50" y="300" width="54" height="125" rx="27" fill="#dce4ed" transform="rotate(18 77 362)"/>
 <rect x="336" y="300" width="54" height="125" rx="27" fill="#dce4ed" transform="rotate(-28 363 362)"/>
 <!-- legs -->
 <rect x="145" y="448" width="68" height="92" rx="30" fill="#cbd5e2"/><rect x="230" y="448" width="68" height="92" rx="30" fill="#cbd5e2"/>
 <path d="M166 475v36M251 475v36" stroke="#aeb9c9" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- Nib -->
<g transform="translate(1000 510)"><ellipse cx="0" cy="92" rx="82" ry="16" fill="#000" opacity=".4" filter="url(#shadow)"/><circle r="66" fill="#ffb86b"/><circle r="52" fill="#ffc987"/><rect x="-27" y="-24" width="54" height="47" rx="22" fill="#273044"/><ellipse cx="0" cy="-2" rx="14" ry="18" fill="#8ff5e2"/><circle cx="-5" cy="-9" r="5" fill="#fff"/><path d="M49 27q35 2 32 33" fill="none" stroke="#d9874a" stroke-width="11" stroke-linecap="round"/><path d="M-48 -54l-16 -24" stroke="#d9874a" stroke-width="9" stroke-linecap="round"/></g>
<!-- orbit doodles -->
<g fill="#ffc27a"><path d="M1040 145l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/><circle cx="560" cy="240" r="6"/><circle cx="1090" cy="320" r="5"/></g>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="76" y="105" fill="#8ff5e2" font-size="18" font-weight="700" letter-spacing="6">A SMALL WORLD, FULL OF LIFE</text>
 <text x="70" y="300" fill="#fff8f0" font-size="150" font-weight="900" letter-spacing="-9">PIPO</text>
 <text x="82" y="365" fill="#ffc27a" font-size="31" font-weight="700">has his own plans.</text>
 <text x="82" y="420" fill="#d5deeb" font-size="19">A little robot. A very big life.</text>
 <path d="M82 462H430" stroke="#8ff5e2" stroke-width="2" stroke-opacity=".6"/>
 <text x="82" y="510" fill="#aeb9c9" font-size="14" letter-spacing="3">AUTONOMOUS CHARACTER  /  LIVING 3D WORLD</text>
 <text x="82" y="540" fill="#aeb9c9" font-size="14" letter-spacing="3">MEMORY  /  MOODS  /  MISCHIEF  /  NIB</text>
 <text x="82" y="690" fill="#8ff5e2" font-size="15" font-weight="700" letter-spacing="4">NOT AN ASSISTANT. THE MAIN CHARACTER.</text>
 <text x="1090" y="70" fill="#aeb9c9" font-size="13" text-anchor="end" letter-spacing="3">EST. IN CURIOSITY</text>
</g>
</svg>