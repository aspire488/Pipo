<g fill="#C98B61" opacity=".28"><circle cx="80" cy="90" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="265" cy="70" r="3"/><circle cx="590" cy="80" r="3"/><circle cx="710" cy="140" r="3"/><circle cx="1110" cy="80" r="3"/></g>
<!-- window -->
<rect x="75" y="92" width="250" height="260" rx="12" fill="#875D49"/>
<rect x="88" y="105" width="224" height="234" rx="6" fill="url(#glass)"/>
<circle cx="263" cy="155" r="35" fill="#F9D18A"/>
<path d="M90 285Q145 230 195 278T310 265V340H90Z" fill="#7D9C78"/>
<path d="M90 310Q145 280 190 310T310 295V340H90Z" fill="#5D7C66"/>
<path d="M199 105V339M88 222H312" stroke="#875D49" stroke-width="10"/>
<path d="M60 80Q100 55 130 82V355Q100 330 60 354Z" fill="#D98E67"/><path d="M340 80Q300 55 270 82V355Q300 330 340 354Z" fill="#D98E67"/>
