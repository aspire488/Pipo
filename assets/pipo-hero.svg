<rect x="720" y="490" width="42" height="28" rx="5" fill="#7D9A79" transform="rotate(-12 720 490)"/><circle cx="755" cy="485" r="9" fill="#E9B66E"/><path d="M760 480l30-25" stroke="#A66F4C" stroke-width="6" stroke-linecap="round"/>
<!-- wall note -->
<rect x="390" y="70" width="160" height="65" rx="5" fill="#F8D78E" transform="rotate(-4 390 70)"/><path d="M412 93h105M412 108h70" stroke="#A9794F" stroke-width="4" stroke-linecap="round" opacity=".65"/>
<text x="62" y="590" font-family="Georgia,serif" font-size="24" fill="#F8EAD8" opacity=".92">A little life of his own.</text>
<text x="1138" y="590" text-anchor="end" font-family="Georgia,serif" font-style="italic" font-size="18" fill="#F8EAD8" opacity=".8">Pipo &amp; Nib</text>
</svg>