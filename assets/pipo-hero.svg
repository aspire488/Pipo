<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Pipo — a little life of his own</title><desc id="desc">A warm, illustrated cutaway of Pipo's cosy room. Pipo stands in the middle, Nib peeks out of a box, and the room is full of small things to discover.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#F7E9D2"/><stop offset="1" stop-color="#E8D3B7"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#C88F65"/><stop offset="1" stop-color="#9C644A"/></linearGradient>
 <linearGradient id="shell" x2="1" y2="1"><stop stop-color="#FFFDF4"/><stop offset=".55" stop-color="#E7E4D8"/><stop offset="1" stop-color="#B7B6A8"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#B9D8D1"/><stop offset="1" stop-color="#E6C99F"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="650" rx="28" fill="#F4E6D2"/>
<circle cx="1000" cy="110" r="150" fill="#F4B66D" opacity=".24" filter="url(#soft)"/>
<path d="M0 0H1200V500H0Z" fill="url(#wall)"/>
<path d="M0 500H1200V650H0Z" fill="url(#floor)"/>
<path d="M0 500H1200" stroke="#81543F" stroke-width="9"/>
