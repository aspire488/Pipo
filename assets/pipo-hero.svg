<ellipse cx="545" cy="232" rx="13" ry="17" fill="#DDF3D8"/><ellipse cx="605" cy="232" rx="13" ry="17" fill="#DDF3D8"/>
<path d="M548 260Q575 280 603 260" fill="none" stroke="#DDF3D8" stroke-width="5" stroke-linecap="round"/>
<circle cx="473" cy="236" r="17" fill="#C4C6B9"/><circle cx="677" cy="236" r="17" fill="#C4C6B9"/>
<path d="M575 155V115" stroke="#92998C" stroke-width="9" stroke-linecap="round"/><circle cx="575" cy="104" r="15" fill="#EBAF62"/><circle cx="570" cy="99" r="5" fill="#FFF0CE"/>
