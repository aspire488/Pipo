<path d="M120 460Q150 410 220 440L245 520H105Z" fill="#B87B53"/><path d="M110 455L155 485L240 455" fill="none" stroke="#8D5B42" stroke-width="8"/>
<circle cx="177" cy="453" r="35" fill="#D99B55"/><circle cx="185" cy="448" r="12" fill="#4D5145"/><circle cx="188" cy="444" r="4" fill="#F8E7C6"/><path d="M145 474Q177 490 207 474" stroke="#A86E45" stroke-width="5" fill="none"/>
