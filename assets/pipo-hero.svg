<rect x="935" y="140" width="65" height="40" rx="4" fill="#6F8A76"/><path d="M944 150h47M944 160h36" stroke="#F7E9D2" stroke-width="3"/>
<path d="M1050 180V130Q1085 90 1110 130V180Z" fill="#B9A47C"/><path d="M1080 130V105" stroke="#6D8768" stroke-width="5"/>
